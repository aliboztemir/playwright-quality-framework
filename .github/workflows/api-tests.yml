name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    # ─────────────────────────────────────────────────────────────
    # NOTE: These tests target a live Odoo 17 eCommerce instance.
    # Configure GitHub Secrets with the variables below before running.
    # ─────────────────────────────────────────────────────────────

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api
        env:
          ODOO_URL:            ${{ secrets.ODOO_URL }}
          ODOO_DB:             ${{ secrets.ODOO_DB }}
          ODOO_ADMIN_EMAIL:    ${{ secrets.ODOO_ADMIN_EMAIL }}
          ODOO_ADMIN_PASSWORD: ${{ secrets.ODOO_ADMIN_PASSWORD }}
          PGHOST:              ${{ secrets.PGHOST }}
          PGPORT:              ${{ secrets.PGPORT }}
          PGDATABASE:          ${{ secrets.PGDATABASE }}
          PGUSER:              ${{ secrets.PGUSER }}
          PGPASSWORD:          ${{ secrets.PGPASSWORD }}

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-api
          path: allure-report/
          retention-days: 30
