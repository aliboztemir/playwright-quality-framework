name: UI Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout test repo
        uses: actions/checkout@v4

      - name: Checkout sandbox repo
        uses: actions/checkout@v4
        with:
          repository: aliboztemir/odoo-ecommerce-sandbox
          ref: ci/sandbox-bootstrap
          path: .sandbox

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Odoo sandbox
        id: sandbox
        uses: ./.sandbox/.github/actions/start-sandbox
        with:
          compose-file: docker-compose.ci.yml
          host-port: "8069"
          wait-timeout-seconds: "420"
          working-directory: .sandbox

      - name: Validate test environment
        shell: bash
        run: |
          test -n "${ODOO_URL}" || (echo "ODOO_URL is required" && exit 1)
          curl -fsS "${ODOO_URL}/web/login" > /dev/null
          curl -fsS "${ODOO_URL}/web/signup" > /dev/null
          curl -fsS "${ODOO_URL}/shop" > /dev/null
        env:
          ODOO_URL: ${{ steps.sandbox.outputs.base-url }}

      - name: Run smoke tests
        run: npm run test:smoke -- --project=chromium
        env:
          ODOO_URL: ${{ steps.sandbox.outputs.base-url }}
          ODOO_DB: odoo
          ODOO_ADMIN_EMAIL: admin
          ODOO_ADMIN_PASSWORD: admin
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: odoo
          PGUSER: odoo
          PGPASSWORD: odoo_password

      - name: Dump sandbox logs on failure
        if: failure()
        working-directory: .sandbox
        run: docker compose -f docker-compose.ci.yml logs --no-color

      - name: Show docker state on failure
        if: failure()
        run: docker ps -a

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: reports/html/
          retention-days: 7

      - name: Stop Odoo sandbox
        if: always()
        uses: ./.sandbox/.github/actions/stop-sandbox
        with:
          compose-file: docker-compose.ci.yml
          working-directory: .sandbox
